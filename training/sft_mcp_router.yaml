# spark-s1-mcp-router: LoRA SFT on top of the v8 bf16 checkpoint. New 'mcp_tool_need' records (Nemotron-written, Qwen-verified, code-labelled) + replay.
model: ../Open-Spark-Jev/checkpoints/v8-4b
output_dir: training/ckpt/mcp-router-v1
data:
  - training/data/mcp_router_mix.jsonl
seed: 0
val_frac: 0.02
max_len: 2048
epochs: 2
batch_size: 8
grad_accum: 4
lr: 3.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
lambda_brier: 1.0
gradient_checkpointing: true
aux_head: false
lora: {r: 16, alpha: 32, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, in_proj_qkv, in_proj_z, in_proj_b, in_proj_a, out_proj]}
log_every: 10
